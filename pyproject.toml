[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspark-declarative-demo"
version = "0.1.0"
description = "A demo project for Spark Declarative Pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.7.0",
    "ruff>=0.4.0",
    "bandit>=1.7.0",
    "interrogate>=1.7.0",
    "detect-secrets>=1.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.bandit]
skips = ["B101"]  # assert statements are standard in pytest tests

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-private = true
fail-under = 80
verbose = 0
quiet = false
