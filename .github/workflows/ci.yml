name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

# Grant the minimum permissions the workflow needs; jobs can narrow further.
permissions:
  contents: read

# Cancel any in-progress run for the same branch/PR to avoid wasting resources.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Pre-commit – linting, formatting, security & docstring checks
  #
  # Runs every hook declared in .pre-commit-config.yaml against all files:
  #   • trailing-whitespace / end-of-file-fixer / check-yaml / check-toml
  #   • ruff (lint + isort) and ruff-format
  #   • bandit (security)
  #   • interrogate (docstring coverage)
  #   • detect-secrets (secret scanning)
  # ---------------------------------------------------------------------------
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # pre-commit/action caches hook environments in ~/.cache/pre-commit
      # automatically, keyed on the .pre-commit-config.yaml hash.
      - name: Run pre-commit hooks (all files)
        uses: pre-commit/action@v3.0.1

  # ---------------------------------------------------------------------------
  # Job 2: Tests – pytest across multiple Python versions
  #
  # Matrix: Python 3.10, 3.11, 3.12 × ubuntu-latest
  # Requires Java 17 (Temurin) because Apache Spark runs on the JVM.
  # Coverage XML is uploaded as a workflow artifact on the Python 3.12 run.
  # ---------------------------------------------------------------------------
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      # Keep going if one Python version fails so we see the full picture.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Apache Spark requires a JVM; Temurin 17 is the LTS release recommended
      # by the Spark project and matches the project's local dev environment.
      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest with coverage
        env:
          # Point PySpark worker processes at the same Python interpreter that
          # is running the driver (the one setup-python placed on PATH).
          PYSPARK_PYTHON: python
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          pytest \
            --cov=src/python \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      # Upload the coverage report only once (from the highest Python version).
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
